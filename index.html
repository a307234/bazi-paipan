<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="专业八字排盘 — 四柱、十神、藏干、纳音、神煞、格局、称骨、大运流年、身势喜用" />
  <title>荣恩的周易学堂</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='none' stroke='%23333' stroke-width='2'/><path d='M50 2A48 48 0 0 1 50 98A24 24 0 0 1 50 50A24 24 0 0 0 50 2Z' fill='%23fff'/><path d='M50 2A48 48 0 0 0 50 98A24 24 0 0 0 50 50A24 24 0 0 1 50 2Z' fill='%23111'/><circle cx='50' cy='26' r='7' fill='%23111'/><circle cx='50' cy='74' r='7' fill='%23fff'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand">
        <span class="brand__mark">
          <svg viewBox="0 0 100 100" class="brand__taiji">
            <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M50 2 A48 48 0 0 1 50 98 A24 24 0 0 1 50 50 A24 24 0 0 0 50 2Z" fill="#fff"/>
            <path d="M50 2 A48 48 0 0 0 50 98 A24 24 0 0 0 50 50 A24 24 0 0 1 50 2Z" fill="#111"/>
            <circle cx="50" cy="26" r="7" fill="#111"/>
            <circle cx="50" cy="74" r="7" fill="#fff"/>
          </svg>
        </span>
        <div>
          <h1 class="brand__title">荣恩的周易学堂</h1>
          <p class="brand__sub">专业八字排盘系统</p>
        </div>
      </div>
      <div class="theme-switcher" title="切换配色主题">
        <button class="theme-btn theme-btn--classic" data-theme="classic" aria-label="经典黑灰"></button>
        <button class="theme-btn theme-btn--hermes" data-theme="hermes" aria-label="爱马仕橙"></button>
        <button class="theme-btn theme-btn--tiffany" data-theme="tiffany" aria-label="蒂芙尼蓝"></button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel panel--input" id="calendar">
      <h2 class="panel__title">生辰信息</h2>
      <form class="birth-form" onsubmit="return false;">
        <fieldset class="gender-field">
          <legend>性别</legend>
          <label><input type="radio" name="gender" value="1" checked /> 男</label>
          <label><input type="radio" name="gender" value="0" /> 女</label>
        </fieldset>

        <div class="form-row">
          <label class="form-label--wider">
            <span>出生地</span>
            <input id="birthplace" type="text" list="city-list" value="长沙" placeholder="输入城市名或选择" autocomplete="address-level2" />
            <datalist id="city-list"></datalist>
            <p id="city-hint" class="field-hint" aria-live="polite"></p>
          </label>
          <label class="form-label--check">
            <input id="use-true-solar" type="checkbox" checked />
            <span>真太阳时校准</span>
          </label>
        </div>

        <fieldset class="calendar-type-field">
          <legend>历法</legend>
          <label class="cal-type-label"><input type="radio" name="calendar-type" value="solar" checked /> 阳历（公历）</label>
          <label class="cal-type-label"><input type="radio" name="calendar-type" value="lunar" /> 阴历（农历）</label>
          <label id="leap-month-wrap" class="form-label--check cal-leap" hidden>
            <input id="lunar-leap" type="checkbox" />
            <span>闰月</span>
          </label>
        </fieldset>

        <div class="form-grid">
          <label>年<input id="birth-year" type="number" min="1900" max="2100" /></label>
          <label>月<input id="birth-month" type="number" min="1" max="12" /></label>
          <label>日<input id="birth-day" type="number" min="1" max="31" /></label>
          <label>时<input id="birth-hour" type="number" min="0" max="23" /></label>
          <label>分<input id="birth-minute" type="number" min="0" max="59" value="0" /></label>
        </div>
        <button type="button" id="btn-paipan" class="btn-primary">开始排盘</button>
      </form>

      <section class="case-panel" aria-label="案例">
        <div class="case-panel__head">
          <h2 class="panel__title panel__title--sub">案例（本地保存）</h2>
          <div class="case-panel__ops">
            <button type="button" id="btn-case-export" class="btn-ghost">导出</button>
            <button type="button" id="btn-case-import" class="btn-ghost">导入</button>
            <input id="case-import-file" type="file" accept="application/json,.json" hidden />
          </div>
        </div>
        <ul id="case-list" class="case-list"></ul>
      </section>
    </aside>

    <section class="panel panel--result" id="paipan">
      <p id="result-empty" class="result-empty">填写信息后点击「开始排盘」</p>
      <div id="result-panel" hidden>
        <header class="result-head">
          <div class="result-head__top">
            <h2>八字排盘</h2>
            <div class="result-actions" id="result-actions">
              <button type="button" id="btn-share" class="btn-secondary" title="复制可打开同一盘的链接">分享链接</button>
              <button type="button" id="btn-save-img" class="btn-secondary" title="将排盘结果保存为图片">保存图片</button>
            </div>
          </div>
          <p id="meta-line" class="meta-line"></p>
          <div id="extra-meta" class="extra-meta"></div>
          <nav class="consult-jump" id="consult-jump" aria-label="面诊跳转">
            <a href="#shengshi-block">身势</a>
            <a href="#dayun-block">大运</a>
            <a href="#relations-block">刑冲</a>
            <a href="#notes-block">批注</a>
            <a href="#calendar">案例</a>
          </nav>
        </header>

        <div id="pillar-cards" class="pillar-cards"></div>

        <div class="table-wrap">
          <table id="bazi-table" class="bazi-table" aria-label="四柱详表"></table>
        </div>

        <div class="analysis-stack" id="analysis-stack">
          <article class="analysis-block" id="shengshi-block" data-open="true">
            <button type="button" class="analysis-block__head" aria-expanded="true" aria-controls="shengshi-body">
              <h3 class="analysis-block__title">身势强弱</h3>
              <span class="analysis-block__chevron" aria-hidden="true"></span>
            </button>
            <div id="shengshi-body" class="analysis-block__body"></div>
          </article>

          <article class="analysis-block" id="geju-block" data-open="false">
            <button type="button" class="analysis-block__head" aria-expanded="false" aria-controls="geju-panel">
              <h3 class="analysis-block__title">命格综评</h3>
              <span class="analysis-block__chevron" aria-hidden="true"></span>
            </button>
            <div id="geju-panel" class="analysis-block__body geju-panel"></div>
          </article>

          <article class="analysis-block" id="dayun-block" data-open="true">
            <button type="button" class="analysis-block__head" aria-expanded="true" aria-controls="dayun-body">
              <h3 class="analysis-block__title">大运流年</h3>
              <span class="analysis-block__chevron" aria-hidden="true"></span>
            </button>
            <div id="dayun-body" class="analysis-block__body"></div>
          </article>

          <article class="analysis-block" id="relations-block" data-open="true">
            <button type="button" class="analysis-block__head" aria-expanded="true" aria-controls="relations-body">
              <h3 class="analysis-block__title">刑冲合害</h3>
              <span class="analysis-block__chevron" aria-hidden="true"></span>
            </button>
            <div id="relations-body" class="analysis-block__body"></div>
          </article>

          <article class="analysis-block" id="chenggu-block" data-open="false">
            <button type="button" class="analysis-block__head" aria-expanded="false" aria-controls="chenggu-body">
              <h3 class="analysis-block__title">称骨算命</h3>
              <span class="analysis-block__chevron" aria-hidden="true"></span>
            </button>
            <div id="chenggu-body" class="analysis-block__body chenggu-body"></div>
          </article>

          <article class="analysis-block" id="notes-block" data-open="true">
            <button type="button" class="analysis-block__head" aria-expanded="true" aria-controls="notes-body">
              <h3 class="analysis-block__title">批注</h3>
              <span class="analysis-block__chevron" aria-hidden="true"></span>
            </button>
            <div id="notes-body" class="analysis-block__body notes-body">
              <div class="notes-form">
                <label>称呼<input id="case-name" type="text" maxlength="40" placeholder="客户称呼" autocomplete="name" /></label>
                <label>问事<input id="case-question" type="text" maxlength="80" placeholder="事业 / 感情 / 财运…" /></label>
                <label class="notes-form__full">批注<textarea id="case-notes" rows="5" maxlength="4000" placeholder="当面要点、宜忌提醒、下次跟进…"></textarea></label>
                <div class="notes-actions">
                  <button type="button" id="btn-case-save" class="btn-secondary">存为新案例</button>
                  <button type="button" id="btn-case-update" class="btn-secondary" hidden>更新当前案例</button>
                  <button type="button" id="btn-case-clear" class="btn-ghost">清空批注</button>
                </div>
                <p id="case-status" class="case-status" aria-live="polite"></p>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="about">
    <p>节气换月 · 真太阳时可选 · 晚子时日柱当日、时柱次日。身势/神煞/格局/称骨仅供文化学习参考。</p>
    <p>最终解释权归荣恩个人所有。</p>
  </footer>

  <script src="lib/lunar.js"></script>
  <script src="js/wx-data.js"></script>
  <script src="js/cities.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/shensha.js"></script>
  <script src="js/relations.js"></script>
  <script src="js/geju.js"></script>
  <script src="js/shengshi.js"></script>
  <script src="js/chenggu.js"></script>
  <script src="js/bazi-engine.js"></script>
  <script src="js/app.js"></script>

  <script>
  // 初始化城市列表 datalist
  (function () {
    var dl = document.getElementById("city-list");
    if (dl && window.BaziCities) {
      BaziCities.CITIES.forEach(function (c) {
        var opt = document.createElement("option");
        opt.value = c.n;
        opt.label = c.n + "（" + c.p + "）";
        dl.appendChild(opt);
      });
    }
  })();
  </script>
</body>
</html>
